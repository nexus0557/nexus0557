<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151a20">
  <title>생리학 통합 문제은행</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #151a20;
      --card: #1d242c;
      --subcard: #182028;
      --option: #232c36;
      --line: #3a4654;
      --text: #e5eaf0;
      --muted: #aab5c2;
      --green: #a4e2bd;
      --green-bg: #233c31;
      --red: #f0b0ac;
      --red-bg: #412d32;
      --accent: #b7cbe2;
      --accent-bg: #273444;
      --yellow: #facc15;
      --yellow-hover: #fde047;
      --yellow-border: #fef08a;
      --yellow-ink: #171408;
      --sky: #38bdf8;
      --sky-hover: #7dd3fc;
      --sky-border: #bae6fd;
      --sky-ink: #0c1926;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont,
        "맑은 고딕", sans-serif;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    button {
      font: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 24px 16px;
      padding-bottom: max(30px, env(safe-area-inset-bottom));
    }

    .top-panel {
      display: block;
    }

    header {
      margin-bottom: 14px;
    }

    .title-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
    }

    h1 {
      margin: 0;
      font-size: 1.48rem;
      letter-spacing: -.03em;
    }

    #mode-badge {
      padding: 4px 11px;
      border: 1px solid #5c7a99;
      border-radius: 999px;
      background: var(--accent-bg);
      color: #e4f0fb;
      font-size: .82rem;
      font-weight: 800;
    }

    #mode-badge.is-exam {
      border-color: var(--yellow-border);
      background: var(--yellow);
      color: var(--yellow-ink);
    }

    .description {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    /* 상단 주요 버튼 바 */
    .control-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .big-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 60px;
      padding: 10px 12px;
      border-radius: 13px;
      text-align: center;
      word-break: keep-all;
      cursor: pointer;
      transition: transform .12s ease, background-color .15s ease;
    }

    .big-btn:active {
      transform: scale(.985);
    }

    .big-btn-main {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 1.05rem;
      font-weight: 850;
      letter-spacing: -.02em;
      line-height: 1.2;
    }

    .big-btn-sub {
      font-size: .79rem;
      font-weight: 700;
      opacity: .86;
      line-height: 1.2;
    }

    .big-btn.is-shuffle {
      border: 2px solid var(--sky-border);
      background: var(--sky);
      color: var(--sky-ink);
      box-shadow: 0 4px 14px rgba(56, 189, 248, .22);
    }

    .big-btn.is-exam-start {
      border: 2px solid var(--yellow-border);
      background: var(--yellow);
      color: var(--yellow-ink);
      box-shadow: 0 4px 16px rgba(250, 204, 21, .28);
    }

    .big-btn.is-return-all {
      border: 2px solid #bbf7d0;
      background: #4ade80;
      color: #0b2415;
      box-shadow: 0 4px 14px rgba(74, 222, 128, .24);
    }

    #toast {
      margin: 0 0 12px;
      padding: 9px 12px;
      border: 1px solid #6382a3;
      border-radius: 10px;
      background: #1f2e3e;
      color: #e4f0fc;
      font-size: .86rem;
      font-weight: 650;
    }

    /* 점수판 */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .score-box {
      padding: 8px 6px;
      border: 1px solid #354352;
      border-radius: 11px;
      background: var(--card);
      text-align: center;
    }

    .score-box.is-point {
      border-color: #547290;
      background: #1e2a36;
    }

    .score-label {
      display: block;
      color: #c2cdd9;
      font-size: .9rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .score-value {
      display: block;
      margin-top: 3px;
      font-size: clamp(1.25rem, 3.6vw, 1.55rem);
      font-weight: 850;
      line-height: 1.18;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    .score-sub {
      font-size: .9rem;
      font-weight: 700;
      color: var(--muted);
    }

    .score-value.is-accent {
      color: var(--accent);
    }

    .score-value.is-green {
      color: var(--green);
    }

    .score-value.is-red {
      color: var(--red);
    }

    /* 파트별 출제 현황 */
    .part-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .part-chip {
      padding: 7px 14px;
      border: 1.5px solid #3c4b5c;
      border-radius: 999px;
      background: var(--subcard);
      color: #c4cfdc;
      font-size: .96rem;
      font-weight: 750;
      line-height: 1.3;
      word-break: keep-all;
    }

    .part-chip.is-active {
      border-color: #93b8dc;
      background: #26394d;
      color: #f2f8ff;
    }

    .chip-short {
      display: none;
    }

    .progress-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 4px 16px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: .9rem;
    }

    .progress-track {
      height: 6px;
      margin-bottom: 16px;
      overflow: hidden;
      border-radius: 10px;
      background: #303b47;
    }

    #progress-fill {
      width: 0;
      height: 100%;
      background: #9db9d5;
      transition: width .2s ease;
    }

    /* 문제 카드 */
    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 24px;
      border: 1px solid #34404c;
      border-radius: 18px;
      background: var(--card);
    }

    .card-body {
      min-width: 0;
    }

    .card-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    #question-meta {
      padding: 5px 11px;
      border-radius: 8px;
      background: #273340;
      color: #dce9f7;
      font-size: .92rem;
      font-weight: 800;
    }

    #source-number {
      color: var(--accent);
      font-size: 1.06rem;
      font-weight: 800;
      line-height: 1.35;
      white-space: pre-line;
    }

    #question {
      margin: 0 0 20px;
      font-size: 1.16rem;
      font-weight: 650;
      line-height: 1.75;
      letter-spacing: -.02em;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    #choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      min-width: 0;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--option);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .choice-number {
      display: grid;
      place-items: center;
      flex: 0 0 28px;
      min-height: 28px;
      border: 1px solid #667689;
      border-radius: 8px;
      color: #c5cfdb;
      font-size: .85rem;
      font-weight: 700;
    }

    .choice-text {
      flex: 1;
      min-width: 0;
      font-size: 1rem;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .choice-status {
      display: inline-block;
      margin-left: 8px;
      font-size: .82rem;
      font-weight: 800;
    }

    .choice.correct {
      border-color: #85bc99;
      background: var(--green-bg);
      color: #e1f7e9;
    }

    .choice.correct .choice-number {
      border-color: var(--green);
      color: var(--green);
    }

    .choice.correct .choice-status {
      color: var(--green);
    }

    .choice.wrong {
      border-color: #cb918d;
      background: var(--red-bg);
    }

    .choice.wrong .choice-number,
    .choice.wrong .choice-status {
      color: var(--red);
      border-color: var(--red);
    }

    .choice:disabled {
      opacity: 1;
      cursor: default;
    }

    /* 완료 결과 요약 */
    #summary-box {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .final-score-banner {
      padding: 18px 14px;
      border: 1px solid #4c6882;
      border-radius: 14px;
      background: #1a2632;
      text-align: center;
    }

    .final-score-label {
      display: block;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 700;
    }

    .final-score-number {
      display: block;
      margin: 4px 0;
      color: var(--green);
      font-size: 2rem;
      font-weight: 850;
      letter-spacing: -.03em;
    }

    .final-score-rate {
      color: var(--accent);
      font-size: .95rem;
      font-weight: 650;
    }

    .part-result-list {
      display: grid;
      gap: 8px;
    }

    .part-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid #33404e;
      border-radius: 10px;
      background: var(--subcard);
      font-size: .98rem;
    }

    .part-result-name {
      font-weight: 750;
      color: var(--text);
    }

    .part-result-score {
      font-weight: 800;
      color: var(--accent);
    }

    #feedback {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #547962;
      border-radius: 13px;
      background: #203329;
    }

    #feedback.is-wrong {
      background: #302b30;
      border-color: #906e75;
    }

    #result {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 1.05rem;
      font-weight: 750;
    }

    #feedback.is-wrong #result {
      color: var(--red);
    }

    .answer-box {
      padding: 11px 12px;
      border-radius: 9px;
      background: #131b20;
    }

    .answer-label {
      display: block;
      margin-bottom: 3px;
      color: var(--green);
      font-size: .82rem;
      font-weight: 700;
    }

    #answer-text {
      margin: 0;
      color: #f0f7f3;
      font-size: .98rem;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .explanation-label {
      margin: 13px 0 5px;
      color: #c3d1e0;
      font-size: .86rem;
      font-weight: 700;
    }

    #explanation {
      margin: 0;
      color: #e3e8ed;
      font-size: .96rem;
      line-height: 1.7;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .card-footer-actions {
      display: grid;
      gap: 8px;
      margin-top: 20px;
    }

    #next {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      border: 0;
      border-radius: 11px;
      background: #b6cce0;
      color: #182533;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    #next:disabled {
      background: #35414e;
      color: #a4afbc;
      cursor: default;
    }

    #secondary-action {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border: 2px solid var(--yellow-border);
      border-radius: 11px;
      background: var(--yellow);
      color: var(--yellow-ink);
      font-size: .95rem;
      font-weight: 850;
      cursor: pointer;
    }

    .hint {
      margin: 14px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: .82rem;
    }

    button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    @media (hover: hover) {
      .choice:hover:not(:disabled) {
        background: #2b3744;
        border-color: #98aec4;
      }

      #next:hover:not(:disabled) {
        background: #c9dbeb;
      }

      .big-btn.is-shuffle:hover {
        background: var(--sky-hover);
      }

      .big-btn.is-exam-start:hover,
      #secondary-action:hover {
        background: var(--yellow-hover);
      }

      .big-btn.is-return-all:hover {
        background: #86efac;
      }
    }

    /* =====================================================
       모바일 한 화면(100dvh) 노스크롤 최적화 레이아웃
       ===================================================== */
    @media (max-width: 640px) {
      html,
      body {
        height: 100dvh;
        overflow: hidden;
      }

      main {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 100%;
        padding: 8px 10px max(8px, env(safe-area-inset-bottom));
        overflow: hidden;
      }

      .top-panel {
        flex: 0 0 auto;
      }

      header {
        margin-bottom: 6px;
      }

      .title-line {
        justify-content: space-between;
        gap: 6px;
      }

      h1 {
        font-size: 1.05rem;
      }

      #mode-badge {
        padding: 2px 8px;
        font-size: .74rem;
      }

      .description,
      .progress-row,
      .hint {
        display: none;
      }

      /* 상단 버튼 바: 눈에 띄는 컬러는 유지하고 높이만 슬림화 */
      .control-bar {
        gap: 7px;
        margin-bottom: 6px;
      }

      .big-btn {
        min-height: 38px;
        padding: 6px 8px;
        border-radius: 10px;
      }

      .big-btn-main {
        font-size: .92rem;
      }

      .big-btn-sub {
        display: none;
      }

      #toast {
        margin-bottom: 6px;
        padding: 6px 10px;
        font-size: .78rem;
      }

      /* 점수판: 1줄 4칸 고정 + 큰 숫자 */
      .scoreboard {
        grid-template-columns: 1.25fr 1fr 1fr 1fr;
        gap: 5px;
        margin-bottom: 6px;
      }

      .score-box {
        padding: 4px 3px;
        border-radius: 9px;
      }

      .score-label {
        font-size: .72rem;
      }

      .score-value {
        margin-top: 1px;
        font-size: 1.18rem;
      }

      .score-sub {
        font-size: .74rem;
      }

      .unit-pc {
        display: none;
      }

      /* 파트 표기: 1줄 3등분 고정 */
      .part-chips {
        flex-wrap: nowrap;
        gap: 5px;
        margin-bottom: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .part-chips::-webkit-scrollbar {
        display: none;
      }

      .part-chip {
        flex: 1 0 auto;
        padding: 4px 6px;
        border-radius: 8px;
        font-size: .8rem;
        text-align: center;
        white-space: nowrap;
      }

      .chip-long {
        display: none;
      }

      .chip-short {
        display: inline;
      }

      .progress-track {
        height: 4px;
        margin-bottom: 7px;
      }

      /* 문제 카드: 남은 화면 전체를 차지 + 내부만 필요 시 스크롤 */
      .card {
        flex: 1 1 auto;
        min-height: 0;
        padding: 12px 11px 10px;
        border-radius: 14px;
        overflow: hidden;
      }

      .card-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-right: 2px;
      }

      .card-top {
        margin-bottom: 7px;
        gap: 6px;
      }

      #question-meta {
        padding: 2px 8px;
        font-size: .78rem;
      }

      #source-number {
        font-size: .86rem;
      }

      #question {
        margin: 0 0 10px;
        font-size: .98rem;
        line-height: 1.48;
      }

      #choices {
        gap: 6px;
      }

      .choice {
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border-radius: 10px;
      }

      .choice-number {
        flex: 0 0 24px;
        min-height: 24px;
        border-radius: 6px;
        font-size: .78rem;
      }

      .choice-text {
        font-size: .9rem;
        line-height: 1.38;
      }

      .choice-status {
        font-size: .74rem;
      }

      #feedback {
        margin-top: 10px;
        padding: 11px;
        border-radius: 10px;
      }

      #result {
        margin-bottom: 7px;
        font-size: .94rem;
      }

      .answer-box {
        padding: 8px 10px;
      }

      .answer-label {
        font-size: .74rem;
      }

      #answer-text {
        font-size: .88rem;
      }

      .explanation-label {
        margin: 9px 0 3px;
        font-size: .78rem;
      }

      #explanation {
        font-size: .86rem;
        line-height: 1.55;
      }

      .final-score-banner {
        padding: 14px 12px;
      }

      .final-score-number {
        font-size: 1.65rem;
      }

      .part-result-item {
        padding: 9px 11px;
        font-size: .9rem;
      }

      /* 하단 버튼은 항상 화면 맨 아래 고정 */
      .card-footer-actions {
        flex: 0 0 auto;
        gap: 6px;
        margin-top: 9px;
        padding-top: 8px;
        border-top: 1px solid #2b3540;
      }

      #next {
        min-height: 44px;
        padding: 9px 12px;
        font-size: .95rem;
      }

      #secondary-action {
        min-height: 40px;
        padding: 8px 12px;
        font-size: .88rem;
      }
    }

    /* 초소형 스마트폰(360px 이하) 미세 조정 */
    @media (max-width: 360px) {
      .score-value {
        font-size: 1.05rem;
      }

      .part-chip {
        font-size: .74rem;
        padding: 4px 4px;
      }

      #question {
        font-size: .92rem;
      }

      .choice-text {
        font-size: .85rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="top-panel">
      <header>
        <div class="title-line">
          <h1>생리학 통합 문제은행</h1>
          <span id="mode-badge">전체 문제 모드</span>
        </div>
        <p class="description" id="mode-desc">
          전체 문제를 중복 없이 랜덤으로 풉니다. (1문제당 1점)
        </p>
      </header>

      <!-- 상단 주요 버튼 바 -->
      <section class="control-bar" aria-label="문제 제어 버튼">
        <button id="shuffle-btn" class="big-btn is-shuffle" type="button">
          <span class="big-btn-main">🔀 문제 섞기</span>
          <span class="big-btn-sub" id="shuffle-btn-sub">순서 새로 섞기</span>
        </button>

        <button id="exam-btn" class="big-btn is-exam-start" type="button">
          <span class="big-btn-main" id="exam-btn-main">📝 시험시작</span>
          <span class="big-btn-sub" id="exam-btn-sub">파트별 15문제</span>
        </button>
      </section>

      <p id="toast" role="status" hidden></p>

      <!-- 실시간 점수판 -->
      <section class="scoreboard" aria-label="점수판">
        <div class="score-box is-point">
          <span class="score-label">점수</span>
          <span class="score-value is-accent">
            <span id="score-points">0</span><span class="unit-pc">점</span>
            <span class="score-sub" id="score-max">/ 0</span><span class="score-sub unit-pc">점</span>
          </span>
        </div>
        <div class="score-box">
          <span class="score-label">정답</span>
          <span class="score-value is-green" id="correct-count">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">오답</span>
          <span class="score-value is-red" id="wrong-count">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">남은 문제</span>
          <span class="score-value" id="remaining-count">0</span>
        </div>
      </section>

      <!-- 파트별 출제 현황 -->
      <div class="part-chips" id="part-chips" aria-label="파트별 출제 문항 수"></div>

      <div class="progress-row">
        <span id="progress-text">문제 불러오는 중</span>
        <span id="pool-info"></span>
      </div>

      <div class="progress-track"
           role="progressbar"
           aria-label="학습 진행률"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="0"
           id="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </div>

    <section class="card">
      <div class="card-body" id="card-body">
        <div class="card-top">
          <span id="question-meta"></span>
          <span id="source-number"></span>
        </div>

        <h2 id="question">문제를 불러오는 중입니다.</h2>

        <div id="choices" role="group" aria-label="선택지"></div>
        <div id="summary-box" hidden></div>

        <section id="feedback"
                 aria-label="정답 및 해설"
                 role="status"
                 hidden>
          <p id="result"></p>

          <div class="answer-box">
            <span class="answer-label">정답</span>
            <p id="answer-text"></p>
          </div>

          <p class="explanation-label">해설</p>
          <p id="explanation"></p>
        </section>
      </div>

      <div class="card-footer-actions">
        <button id="next" type="button" disabled>정답을 선택하세요</button>
        <button id="secondary-action" type="button" hidden></button>
      </div>
    </section>

    <p class="hint" id="hint">
      평소에는 전체 문제가 중복 없이 랜덤 출제되며, 노란색 '시험시작' 버튼을 누르면 파트별 15문제 시험이 시작됩니다.
    </p>
  </main>

  <!-- 문제 파일은 실행 코드보다 위에 배치합니다. -->
  <script src="./questions1.js"></script>
  <script src="./questions2.js"></script>
  <script src="./questions3.js"></script>
  <!-- 이후 추가: <script src="./questions4.js"></script> -->

  <script>
    const $ = id => document.getElementById(id);

    const EXAM_PER_PART = 15;
    const EXAM_HISTORY_KEY = "physiology-exam-history-v2";

    // 전역 ID 중복까지 원천 차단하여 파트별 문제 목록 구성
    const seenGlobalIds = new Set();

    const validBanks = (Array.isArray(window.questionBanks) ? window.questionBanks : [])
      .filter(bank => bank && Array.isArray(bank.questions) && bank.questions.length > 0)
      .map((bank, idx) => {
        const sampleId = bank.questions[0]?.id || "";
        const { label, shortLabel } = getBankLabels(bank, sampleId, idx);
        const bankId = bank.id || `bank-${idx + 1}`;

        const uniqueQuestions = [];
        bank.questions.forEach((q, qIdx) => {
          const uniqueId = q.id || `${bankId}-auto-${qIdx + 1}`;
          if (seenGlobalIds.has(uniqueId)) return;
          seenGlobalIds.add(uniqueId);

          uniqueQuestions.push({
            ...q,
            id: uniqueId,
            bankId,
            bankLabel: label
          });
        });

        return {
          id: bankId,
          label,
          shortLabel,
          questions: uniqueQuestions
        };
      })
      .filter(bank => bank.questions.length > 0);

    const allUniqueQuestions = validBanks.flatMap(bank => bank.questions);
    const totalPoolCount = allUniqueQuestions.length;
    const examTotalCount = validBanks.reduce(
      (sum, bank) => sum + Math.min(EXAM_PER_PART, bank.questions.length),
      0
    );

    let currentMode = "all"; // "all" | "exam"
    let sessionQuestions = [];
    let partPlan = {};
    let partStats = {};
    let currentIndex = 0;
    let answeredCount = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let answered = false;
    let isCompleted = false;
    let toastTimer = null;

    function getBankLabels(bank, sampleId, idx) {
      if (sampleId.startsWith("renal-")) {
        return { label: "8장 - 배설생리", shortLabel: "8장 배설" };
      }
      if (sampleId.startsWith("reproductive-")) {
        return { label: "9장 - 생식생리", shortLabel: "9장 생식" };
      }
      if (sampleId.startsWith("endocrine-")) {
        return { label: "10장 - 내분비생리", shortLabel: "10장 내분비" };
      }
      const title = bank.title || `파트 ${idx + 1}`;
      return { label: title, shortLabel: title };
    }

    function shuffle(array) {
      const copied = [...array];
      for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function loadExamHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(EXAM_HISTORY_KEY));
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveExamHistory(history) {
      try {
        localStorage.setItem(EXAM_HISTORY_KEY, JSON.stringify(history));
      } catch {
        // 브라우저 저장소가 제한된 경우 무시
      }
    }

    // 파트별로 이전 시험에 안 나왔던 문제를 우선 뽑되, 한 시험 내 중복은 절대 금지
    function pickExamQuestionsFromBank(bank, limit, history) {
      const target = Math.min(limit, bank.questions.length);
      const validIds = new Set(bank.questions.map(q => q.id));

      const usedList = Array.isArray(history[bank.id])
        ? [...new Set(history[bank.id])].filter(id => validIds.has(id))
        : [];
      const usedSet = new Set(usedList);

      const unseen = shuffle(bank.questions.filter(q => !usedSet.has(q.id)));
      const seen = shuffle(bank.questions.filter(q => usedSet.has(q.id)));

      let picked = [];

      if (unseen.length >= target) {
        picked = unseen.slice(0, target);
        const updatedUsed = [...usedSet, ...picked.map(q => q.id)];
        history[bank.id] = updatedUsed.length >= bank.questions.length ? [] : updatedUsed;
      } else {
        const needMore = target - unseen.length;
        const extra = seen.slice(0, needMore);
        picked = [...unseen, ...extra];
        history[bank.id] = extra.map(q => q.id);
      }

      return picked;
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.hidden = false;

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.hidden = true;
      }, 2500);
    }

    function resetScrollPositions() {
      $("card-body").scrollTop = 0;
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function updateModeUI() {
      const isExam = currentMode === "exam";
      const badge = $("mode-badge");
      const desc = $("mode-desc");
      const shuffleSub = $("shuffle-btn-sub");
      const examBtn = $("exam-btn");
      const examBtnMain = $("exam-btn-main");
      const examBtnSub = $("exam-btn-sub");

      badge.classList.toggle("is-exam", isExam);

      if (isExam) {
        badge.textContent = `📝 시험 (${examTotalCount}문제)`;
        desc.textContent =
          `각 파트별 ${EXAM_PER_PART}문제씩 총 ${examTotalCount}문제를 중복 없이 출제합니다. (1문제당 1점)`;
        shuffleSub.textContent = `파트별 ${EXAM_PER_PART}문제 새로 뽑기`;

        examBtn.classList.remove("is-exam-start");
        examBtn.classList.add("is-return-all");
        examBtnMain.textContent = "📚 전체 문제로";
        examBtnSub.textContent = `전체 ${totalPoolCount}문제 모드로 전환`;
      } else {
        badge.textContent = `전체 (${totalPoolCount}문제)`;
        desc.textContent =
          `전체 ${totalPoolCount}문제를 중복 없이 랜덤으로 풉니다. (1문제당 1점)`;
        shuffleSub.textContent = `전체 ${totalPoolCount}문제 순서 새로 섞기`;

        examBtn.classList.remove("is-return-all");
        examBtn.classList.add("is-exam-start");
        examBtnMain.textContent = `📝 시험시작 (${examTotalCount})`;
        examBtnSub.textContent = `파트별 ${EXAM_PER_PART}문제 · 총 ${examTotalCount}문제`;
      }
    }

    function renderPartChips(activeBankId = null) {
      const container = $("part-chips");
      container.replaceChildren();

      validBanks.forEach(bank => {
        const count = partPlan[bank.id] || 0;
        if (!count) return;

        const chip = document.createElement("span");
        chip.className = "part-chip";
        if (bank.id === activeBankId) {
          chip.classList.add("is-active");
        }

        const longSpan = document.createElement("span");
        longSpan.className = "chip-long";
        longSpan.textContent = `${bank.label} ${count}문제`;

        const shortSpan = document.createElement("span");
        shortSpan.className = "chip-short";
        shortSpan.textContent = `${bank.shortLabel} ${count}`;

        chip.append(longSpan, shortSpan);
        container.appendChild(chip);
      });
    }

    function updateScoreboard() {
      const total = sessionQuestions.length;
      const remaining = Math.max(0, total - answeredCount);
      const percentage = total ? Math.round((answeredCount / total) * 100) : 0;

      $("score-points").textContent = String(correctCount);
      $("score-max").textContent = `/${total}`;
      $("correct-count").textContent = String(correctCount);
      $("wrong-count").textContent = String(wrongCount);
      $("remaining-count").textContent = String(remaining);

      $("progress-text").textContent = `${answeredCount} / ${total}문제 풀이 완료`;
      $("pool-info").textContent =
        currentMode === "exam"
          ? `시험 모드 · 파트별 ${EXAM_PER_PART}문제 (총 ${total}문제)`
          : `전체 문제 · 중복 없이 ${total}문제 모두 출제`;

      $("progress-fill").style.width = `${percentage}%`;
      $("progress-bar").setAttribute("aria-valuenow", percentage);
    }

    function startSession(mode, withNotice = false) {
      currentMode = mode;
      partPlan = {};
      partStats = {};

      let selected = [];

      if (mode === "exam") {
        const history = loadExamHistory();

        validBanks.forEach(bank => {
          const picked = pickExamQuestionsFromBank(bank, EXAM_PER_PART, history);
          partPlan[bank.id] = picked.length;
          partStats[bank.id] = {
            label: bank.label,
            total: picked.length,
            correct: 0
          };
          selected.push(...picked);
        });

        saveExamHistory(history);
      } else {
        validBanks.forEach(bank => {
          partPlan[bank.id] = bank.questions.length;
          partStats[bank.id] = {
            label: bank.label,
            total: bank.questions.length,
            correct: 0
          };
          selected.push(...bank.questions);
        });
      }

      sessionQuestions = shuffle(selected);
      currentIndex = 0;
      answeredCount = 0;
      correctCount = 0;
      wrongCount = 0;
      answered = false;
      isCompleted = false;

      updateModeUI();

      if (withNotice) {
        if (mode === "exam") {
          showToast(
            `시험 시작! 파트별 ${EXAM_PER_PART}문제씩 총 ${sessionQuestions.length}문제가 중복 없이 출제되었습니다.`
          );
        } else {
          showToast(
            `전체 ${sessionQuestions.length}문제를 중복 없이 새로 섞었습니다.`
          );
        }
      }

      showQuestion();
      resetScrollPositions();
    }

    function showQuestion() {
      const current = sessionQuestions[currentIndex];
      if (!current) {
        showCompletion();
        return;
      }

      answered = false;
      updateScoreboard();
      renderPartChips(current.bankId);

      $("summary-box").hidden = true;
      $("summary-box").replaceChildren();
      $("secondary-action").hidden = true;
      $("feedback").hidden = true;
      $("choices").hidden = false;
      $("choices").replaceChildren();

      $("question-meta").textContent =
        `문제 ${currentIndex + 1} / ${sessionQuestions.length}`;
      $("source-number").textContent =
        `${current.bankLabel} · 원문 ${current.number}번`;
      $("question").textContent = current.question;

      $("next").disabled = true;
      $("next").textContent = "정답을 선택하세요";

      current.choices.forEach((text, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";

        const number = document.createElement("span");
        number.className = "choice-number";
        number.textContent = index + 1;

        const label = document.createElement("span");
        label.className = "choice-text";
        label.textContent = text;

        button.append(number, label);
        button.addEventListener("click", () => checkAnswer(index));

        $("choices").appendChild(button);
      });
    }

    function checkAnswer(selected) {
      const current = sessionQuestions[currentIndex];
      if (answered || !current) return;
      answered = true;

      const isCorrect = selected === current.answer;
      answeredCount += 1;

      if (isCorrect) {
        correctCount += 1;
        partStats[current.bankId].correct += 1;
      } else {
        wrongCount += 1;
      }

      [...$("choices").children].forEach((button, index) => {
        button.disabled = true;

        let status = "";
        if (index === current.answer) {
          button.classList.add("correct");
          status = "정답";
        } else if (index === selected) {
          button.classList.add("wrong");
          status = "내 선택";
        }

        if (status) {
          const badge = document.createElement("span");
          badge.className = "choice-status";
          badge.textContent = `[${status}]`;
          button.querySelector(".choice-text").appendChild(badge);
        }
      });

      $("result").textContent = isCorrect
        ? "정답입니다! (+1점)"
        : "오답입니다. 정답을 확인하세요. (0점)";

      $("answer-text").textContent =
        `${current.answer + 1}번. ${current.choices[current.answer]}`;
      $("explanation").textContent = current.explanation;
      $("feedback").classList.toggle("is-wrong", !isCorrect);
      $("feedback").hidden = false;

      updateScoreboard();

      $("next").disabled = false;
      $("next").textContent =
        currentIndex + 1 < sessionQuestions.length
          ? "다음 문제"
          : "최종 점수 확인";

      // 해설이 카드 아래에 걸쳐 가려지지 않도록 부드럽게 표시
      requestAnimationFrame(() => {
        $("feedback").scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    }

    function showCompletion() {
      isCompleted = true;
      updateScoreboard();
      renderPartChips(null);

      const total = sessionQuestions.length;
      const accuracy = total ? Math.round((correctCount / total) * 100) : 0;
      const isExam = currentMode === "exam";

      $("question-meta").textContent = isExam ? "시험 채점 완료" : "전체 풀이 완료";
      $("source-number").textContent = `총 ${total}점 만점 (1문제당 1점)`;
      $("question").textContent = isExam
        ? "파트별 시험 풀이가 끝났습니다."
        : `전체 ${total}문제를 중복 없이 모두 풀었습니다.`;

      $("choices").hidden = true;
      $("choices").replaceChildren();
      $("feedback").hidden = true;

      const summaryBox = $("summary-box");
      summaryBox.replaceChildren();

      const banner = document.createElement("div");
      banner.className = "final-score-banner";

      const label = document.createElement("span");
      label.className = "final-score-label";
      label.textContent = isExam ? "최종 시험 점수" : "최종 점수";

      const number = document.createElement("span");
      number.className = "final-score-number";
      number.textContent = `${correctCount}점 / ${total}점`;

      const rate = document.createElement("span");
      rate.className = "final-score-rate";
      rate.textContent = `정답 ${correctCount}개 · 오답 ${wrongCount}개 (정답률 ${accuracy}%)`;

      banner.append(label, number, rate);

      const list = document.createElement("div");
      list.className = "part-result-list";

      validBanks.forEach(bank => {
        const stat = partStats[bank.id];
        if (!stat || stat.total === 0) return;

        const row = document.createElement("div");
        row.className = "part-result-item";

        const name = document.createElement("span");
        name.className = "part-result-name";
        name.textContent = stat.label;

        const score = document.createElement("span");
        score.className = "part-result-score";
        score.textContent = `${stat.correct}점 / ${stat.total}점`;

        row.append(name, score);
        list.appendChild(row);
      });

      summaryBox.append(banner, list);
      summaryBox.hidden = false;

      $("next").disabled = false;
      $("next").textContent = isExam
        ? `새 시험 다시 풀기 (총 ${examTotalCount}문제)`
        : `전체 ${totalPoolCount}문제 다시 섞어서 풀기`;

      const secondaryBtn = $("secondary-action");
      secondaryBtn.textContent = isExam
        ? `📚 전체 ${totalPoolCount}문제 모드로 돌아가기`
        : `📝 시험시작 (파트별 ${EXAM_PER_PART}문제 · 총 ${examTotalCount}문제)`;
      secondaryBtn.hidden = false;

      resetScrollPositions();
    }

    function confirmInterruptIfNeeded(message) {
      if (answeredCount > 0 && !isCompleted) {
        return window.confirm(message);
      }
      return true;
    }

    $("shuffle-btn").addEventListener("click", () => {
      if (!totalPoolCount) return;

      const msg =
        currentMode === "exam"
          ? `현재 진행 중인 시험을 초기화하고 파트별 ${EXAM_PER_PART}문제를 새로 뽑을까요?`
          : "현재 진행 중인 풀이를 초기화하고 전체 문제를 다시 섞을까요?";

      if (!confirmInterruptIfNeeded(msg)) return;
      startSession(currentMode, true);
    });

    $("exam-btn").addEventListener("click", () => {
      if (!totalPoolCount) return;

      if (currentMode === "all") {
        const msg =
          `진행 중인 전체 문제 풀이를 종료하고 파트별 ${EXAM_PER_PART}문제(총 ${examTotalCount}문제) 시험을 시작할까요?`;
        if (!confirmInterruptIfNeeded(msg)) return;
        startSession("exam", true);
      } else {
        const msg =
          "진행 중인 시험을 종료하고 전체 문제 모드로 돌아갈까요?";
        if (!confirmInterruptIfNeeded(msg)) return;
        startSession("all", true);
      }
    });

    $("secondary-action").addEventListener("click", () => {
      if (!totalPoolCount) return;
      startSession(currentMode === "exam" ? "all" : "exam", true);
    });

    $("next").addEventListener("click", () => {
      if (isCompleted) {
        startSession(currentMode, true);
        return;
      }

      if (currentIndex + 1 < sessionQuestions.length) {
        currentIndex += 1;
        showQuestion();
        resetScrollPositions();
      } else {
        showCompletion();
      }
    });

    if (totalPoolCount > 0) {
      startSession("all", false);
    } else {
      $("progress-text").textContent = "문제 파일 연결 필요";
      $("question").textContent =
        "문제를 불러오지 못했습니다.\n" +
        "questions1.js ~ questions3.js 파일이 index.html과 같은 폴더에 있는지 확인하세요.";
      $("shuffle-btn").hidden = true;
      $("exam-btn").hidden = true;
      $("next").hidden = true;
    }
  </script>
</body>
</html>
