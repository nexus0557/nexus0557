    let sessionQuestions = [];
    let currentIdx = 0;

    function startSet() {
        let shuffled = [...questions].sort(() => 0.5 - Math.random());
        sessionQuestions = shuffled.slice(0, 10);
        currentIdx = 0;
        render();
    }

    function render() {
        const q = sessionQuestions[currentIdx];
        const app = document.getElementById('quiz-app');
        let optionsHtml = q.answerOptions.map(opt => `
            <button class="option-btn" onclick="check(this, ${opt.isCorrect}, '${opt.rationale}')">${opt.text}</button>
        `).join('');

        app.innerHTML = `<div class="quiz-card">
            <h3>Q.${currentIdx+1} / 10</h3>
            <p>${q.question}</p>
            ${optionsHtml}
            <div id="feedback" class="feedback"></div>
            <button id="next-btn" class="next-btn" style="display:none" onclick="next()">다음 문제</button>
        </div>`;
    }

    function check(btn, isCorrect, rationale) {
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        fb.style.background = isCorrect ? '#238636' : '#da3633';
        fb.innerHTML = `<strong>${isCorrect ? '정답입니다!' : '오답입니다!'}</strong><br>${rationale}`;
        document.getElementById('next-btn').style.display = 'block';
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    }

    function next() {
        currentIdx++;
        if(currentIdx < 10) render();
        else {
            document.getElementById('quiz-app').innerHTML = `
                <div class="quiz-card" style="text-align:center">
                    <h2>세트 완료!</h2>
                    <button class="next-btn" onclick="startSet()">새로운 10문제 풀기</button>
                </div>`;
        }
    }
    startSet();
</script>
