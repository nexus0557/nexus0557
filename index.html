<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대학 글쓰기 사이버 트레이닝 (60제)</title>
    <style>
        /* 1. 사이버틱 다크모드 디자인 (코딩 화면 스타일) */
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #58a6ff;
            --text-sub: #c9d1d9;
            --accent: #238636;
            --error: #da3633;
            --terminal-green: #39ff14;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-sub);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.2rem;
            color: var(--terminal-green);
            text-shadow: 0 0 5px var(--terminal-green);
        }

        /* 퀴즈 카드 스타일 */
        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .progress {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            white-space: pre-wrap;
            color: #ffffff;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: var(--text-sub);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            font-size: 1rem;
        }

        .option-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        /* 결과/해설창 스타일 */
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .feedback.correct { background-color: rgba(35, 134, 54, 0.2); border: 1px solid var(--accent); color: #7ee787; }
        .feedback.wrong { background-color: rgba(218, 54, 51, 0.2); border: 1px solid var(--error); color: #ffa198; }

        .rationale {
            font-size: 0.9rem;
            margin-top: 10px;
            color: var(--text-sub);
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            cursor: pointer;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-retry { flex: 1; background-color: #1f6feb; color: white; padding: 15px; border-radius: 8px; cursor: pointer; border:none; }
        .btn-review { flex: 1; background-color: var(--accent); color: white; padding: 15px; border-radius: 8px; cursor: pointer; border:none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>UNIV_WRITING_SYSTEM_V2.exe</h1>
    </div>

    <div id="quiz-area" class="quiz-card">
        <div id="progress" class="progress">LOADING...</div>
        <div id="question" class="question-text">데이터를 불러오는 중입니다...</div>
        <div id="options" class="options-list"></div>
        
        <div id="feedback" class="feedback">
            <strong id="result-text"></strong>
            <div id="rationale" class="rationale"></div>
        </div>

        <button id="next-btn" class="next-btn" onclick="nextQuestion()">NEXT_STEP >></button>
    </div>

    <div id="result-area" class="quiz-card result-screen">
        <h2 style="color:var(--terminal-green)">TRAINING_COMPLETE</h2>
        <p id="score-text"></p>
        <div class="btn-group">
            <button class="btn-retry" onclick="restartQuiz()">처음부터 다시</button>
            <button id="review-btn" class="btn-review" onclick="startReview()">틀린 문제 복습</button>
        </div>
    </div>
</div>

        { qn: 52, q: "[제목] 제목 달기 요령으로 틀린 것은?", options: [{t:"자극적인 낚시성 제목", r:"신뢰를 떨어뜨립니다.", c:true},{t:"동사형 활용", r:"생동감을 줍니다.", c:false}]},
        { qn: 53, q: "[글쓰기] 주장을 재강조하는 단계는?", options: [{t:"결론", r:"정답입니다.", c:true},{t:"서론", r:"흥미 유발 단계입니다.", c:false}]},
        { qn: 54, q: "[표절] 보통 몇 단어 이상 일치 시 표절?", options: [{t:"세 단어", r:"여섯 단어가 기준입니다.", c:false},{t:"여섯 단어", r:"정답입니다.", c:true}]},
        { qn: 55, q: "[요약] 두 번째 읽을 때 할 일은?", options: [{t:"중심어 밑줄", r:"뼈대 추출 단계로 정답입니다.", c:true},{t:"빠르게 훑기", r:"탐색 단계입니다.", c:false}]},
        { qn: 56, q: "[자소서] 지원자의 성향을 보여주는 글?", options: [{t:"이력서", r:"스펙 위주입니다.", c:false},{t:"자기소개서", r:"정답입니다.", c:true}]},
        { qn: 57, q: "[자소서] 사례 제시 시 하면 안 될 행동?", options: [{t:"극복 과정 서술", r:"권장 사항입니다.", c:false},{t:"동료 비방", r:"절대 금지입니다.", c:true}]},
        { qn: 58, q: "[서평] 스포일러 없이 줄거리를 요약함?", options: [{t:"플롯 요약", r:"정답입니다.", c:true},{t:"작가 비평", r:"다른 영역입니다.", c:false}]},
        { qn: 59, q: "[메일] 아이디 설정 시 가장 좋은 것은?", options: [{t:"이름 이니셜 등 유추 가능", r:"신뢰감을 줍니다.", c:true},{t:"공격적 단어 조합", r:"피해야 합니다.", c:false}]},
        { qn: 60, q: "[메일] 제목 작성 요령으로 바른 것은?", options: [{t:"제목란 비우기", r:"예의에 어긋납니다.", c:false},{t:"말머리 활용 핵심 요약", r:"정답입니다.", c:true}]}
    ];

    // 3. 앱 로직
    let questions = [];
    let currentIdx = 0;
    let score = 0;
    let incorrectList = [];

    // 배열 섞기 (랜덤 출제)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initQuiz() {
        questions = [...rawData];
        shuffle(questions);
        currentIdx = 0;
        score = 0;
        incorrectList = [];
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const qData = questions[currentIdx];
        document.getElementById('progress').innerText = `STEP: ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('question').innerText = qData.q;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        qData.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.t;
            btn.onclick = () => checkAnswer(opt);
            optionsDiv.appendChild(btn);
        });

        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selected) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true); // 클릭 방지

        const feedback = document.getElementById('feedback');
        const resText = document.getElementById('result-text');
        const rationale = document.getElementById('rationale');
        
        feedback.style.display = 'block';
        if(selected.c) {
            feedback.className = 'feedback correct';
            resText.innerText = ">> ACCESS_GRANTED: CORRECT";
            score++;
        } else {
            feedback.className = 'feedback wrong';
            resText.innerText = ">> ACCESS_DENIED: WRONG_ANSWER";
            incorrectList.push(questions[currentIdx]);
        }
        
        rationale.innerText = selected.r;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-area').style.display = 'none';
        const resArea = document.getElementById('result-area');
        resArea.style.display = 'block';
        
        document.getElementById('score-text').innerText = `SCORE: ${score} / ${questions.length}`;
        
        const reviewBtn = document.getElementById('review-btn');
        if(incorrectList.length === 0) {
            reviewBtn.style.display = 'none';
        } else {
            reviewBtn.style.display = 'block';
        }
    }

    function restartQuiz() {
        initQuiz();
    }

    function startReview() {
        questions = [...incorrectList];
        shuffle(questions);
        currentIdx = 0;
        score = 0;
        incorrectList = [];
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        showQuestion();
    }

    // 앱 시작
    initQuiz();
</script>
